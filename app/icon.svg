<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Blocks mark (components/viewer/wordmark.tsx): three ink blocks and one in the accent, in the default theme's token colours. -->
  <style>
    .ink { fill: oklch(0.135 0.008 286); }
    .brand { fill: oklch(0.54 0.215 283); }
    @media (prefers-color-scheme: dark) {
      .ink { fill: oklch(1 0 0); }
      .brand { fill: oklch(0.71 0.187 283); }
    }
  </style>
  <rect class="ink" x="0" y="0" width="14" height="14" rx="3" />
  <rect class="ink" x="18" y="0" width="14" height="14" rx="3" />
  <rect class="ink" x="0" y="18" width="14" height="14" rx="3" />
  <rect class="brand" x="18" y="18" width="14" height="14" rx="3" />
</svg>
