<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- The Blocks mark (components/viewer/wordmark.tsx): three ink blocks and one violet, in the token colours. -->
  <style>
    .ink { fill: oklch(0.135 0.008 286); }
    .brand { fill: oklch(0.54 0.215 283); }
    @media (prefers-color-scheme: dark) {
      .ink { fill: oklch(1 0 0); }
      .brand { fill: oklch(0.62 0.209 283); }
    }
  </style>
  <rect class="ink" x="0" y="0" width="9" height="9" rx="2" />
  <rect class="ink" x="11" y="0" width="9" height="9" rx="2" />
  <rect class="ink" x="0" y="11" width="9" height="9" rx="2" />
  <rect class="brand" x="11" y="11" width="9" height="9" rx="2" />
</svg>
